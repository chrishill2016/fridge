name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=$APP_VERSION

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Publish app
        if: github.event_name != 'pull_request'
        run: dotnet publish src/FridgeChef/FridgeChef.csproj -c Release -p:Version=$APP_VERSION -o publish

      - name: Prepare for GitHub Pages
        if: github.event_name != 'pull_request'
        run: build/prepare-pages.sh publish/wwwroot "${{ github.event.repository.name }}"

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: publish/wwwroot

  deploy-app:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
